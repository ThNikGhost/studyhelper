name: Android Build

on:
  push:
    tags:
      - 'android/v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/android/}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "StudyHelper Widget ${{ steps.version.outputs.version }}"
          body: |
            Android Widget APK для StudyHelper.

            **Установка:**
            1. Скачайте APK
            2. Установите (разрешите неизвестные источники)
            3. Добавьте виджет 4×2 на рабочий стол
            4. Введите API ключ из настроек StudyHelper
