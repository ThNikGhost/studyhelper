name: Android Build

on:
  push:
    tags:
      - 'android/v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/android/}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "StudyHelper Widget ${{ steps.version.outputs.version }}"
          body: |
            Android Widget APK для StudyHelper.

            **Установка:**
            1. Скачайте APK
            2. Установите (разрешите неизвестные источники)
            3. Добавьте виджет 4×2 на рабочий стол
            4. Введите API ключ из настроек StudyHelper
